name: release

# Tag v* → build, then publish. Both registries use OIDC trusted publishing, no tokens anywhere:
# PyPI's trusted publisher names this repo, this workflow and the `pypi` environment; npm's
# trusted publisher (package settings on npmjs.com) names this repo and this workflow file.
# npm side: the trusted publisher is stage-only (npm's default and recommendation), so CI
# STAGES the version with provenance and a maintainer approves it on npmjs.com (2FA) or with
# `npm stage approve <stage-id>` — the version goes live only after that human step.
# Needs npm >= 11.15 for `npm stage`, hence the npm upgrade step.

on:
  push:
    tags: ["v*"]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e "receipt-verify-python[dev]" build
      - run: pytest -q receipt-verify-python
      - run: python -m build receipt-verify-python -o dist/
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm test
        working-directory: receipt-verify-node

  publish-pypi:
    needs: build
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write  # OIDC trusted publishing — no tokens anywhere
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          skip-existing: true  # a re-run of a tag (e.g. to redo the npm half) must not fail here

  publish-npm:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      id-token: write  # OIDC trusted publishing + provenance attestation
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
      - name: npm >= 11.15 (trusted publishing + staged publish)
        run: npm install -g npm@latest && npm --version
      - name: stage publish (a maintainer approves the staged version on npmjs.com)
        run: npm stage publish --access public --provenance
        working-directory: receipt-verify-node
