name: release

# Tag v* → build, then publish. Both registries use OIDC trusted publishing, no tokens anywhere:
# PyPI's trusted publisher names this repo, this workflow and the `pypi` environment; npm's
# trusted publisher (package settings on npmjs.com) names this repo and this workflow file.
# npm trusted publishing needs npm >= 11.5.1, hence the npm upgrade step; provenance
# attestations are generated automatically.

on:
  push:
    tags: ["v*"]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e "receipt-verify-python[dev]" build
      - run: pytest -q receipt-verify-python
      - run: python -m build receipt-verify-python -o dist/
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm test
        working-directory: receipt-verify-node

  publish-pypi:
    needs: build
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write  # OIDC trusted publishing — no tokens anywhere
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1

  publish-npm:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      id-token: write  # OIDC trusted publishing + provenance attestation
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
      - name: npm >= 11.5.1 (trusted publishing)
        run: npm install -g npm@latest && npm --version
      - name: publish
        run: npm publish --access public
        working-directory: receipt-verify-node
